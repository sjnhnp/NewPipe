name: Build Antigravity NewPipe

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0). Leave empty to use auto-increment.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NewPipe
        uses: actions/checkout@v4
        with:
          path: NewPipe
          fetch-depth: 0 # Full history for tags

      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: sjnhnp/sing-box
          path: sing-box
          ref: dev-next

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install gomobile (SagerNet fork)
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.11
          $(go env GOPATH)/bin/gomobile init

      - name: Build Libbox AAR
        working-directory: ./sing-box
        run: |
          export PATH=$(go env GOPATH)/bin:$PATH
          go run ./cmd/internal/build_libbox -target android

      - name: Move Libbox AAR
        run: |
          mkdir -p NewPipe/app/libs
          cp sing-box/libbox.aar NewPipe/app/libs/

      - name: Build NewPipe
        working-directory: ./NewPipe
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate Release Info
        id: release_info
        working-directory: ./NewPipe
        run: |
          # 1. Determine Tag Name
          INPUT_TAG="${{ inputs.tag_name }}"
          
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            # Get the last tag that matches our pattern (e.g. antigravity-*)
            LAST_TAG=$(git describe --tags --match "antigravity-*" --abbrev=0 2>/dev/null || echo "antigravity-0")
            # Extract number
            LAST_NUM=$(echo $LAST_TAG | awk -F- '{print $2}')
            # Increment
            NEXT_NUM=$((LAST_NUM + 1))
            TAG_NAME="antigravity-$NEXT_NUM"
          fi
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Tagging as: $TAG_NAME"
          
          # 2. Generate Changelog
          LAST_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log ${LAST_GIT_TAG}..HEAD --pretty=format:"* %h %s" --no-merges >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            ## Changes
            ${{ env.CHANGELOG }}
          files: NewPipe/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewPipe-Antigravity-Debug
          path: NewPipe/app/build/outputs/apk/debug/*.apk
